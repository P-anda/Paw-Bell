<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Circle Animation with Paw Icon</title>
    <link rel="stylesheet" href="static/css/style.css">
    <!-- Link to Font Awesome for the paw icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="circle-container">
        <div class="circle" id="circle">
            <i class="fas fa-paw"></i> <!-- Paw icon -->
        </div>
        <div class="ripple" id="ripple"></div>
    </div>

    <!-- Audio element for sound -->
    <audio id="sound" preload="auto">
        <source src="static/sounds/sound1.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <!-- Switch Element -->
    <label class="switch">
        <input type="checkbox" id="switch">
        <span class="slider"></span>
    </label>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.min.js"></script>
    <script src="static/js/script.js"></script>  <!-- Custom JS file for functionality -->
</body>
</html>
